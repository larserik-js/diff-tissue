name: CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install project dependencies (including dev)
        run: uv sync --dev --all-extras

      - name: Check formatting (Ruff)
        run: make format

      - name: Run Ruff lints
        run: make lint

      - name: Run mypy type checks
        run: make type

      - name: Run all tests
        run: make test-full

  docker:
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t diff-tissue:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d \
            --name diff-tissue \
            -p 8000:8000 \
            diff-tissue:${{ github.sha }}

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done

          echo "API failed to start"
          docker logs diff-tissue
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag image
        if: github.event_name == 'push'
        run: |
          docker tag \
            diff-tissue:${{ github.sha }} \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Trigger Render deployment
        if: github.event_name == 'push'
        run: |
          curl --fail --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK }}&imgURL=ghcr.io%2F${{ github.repository }}%3A${{ github.sha }}"
